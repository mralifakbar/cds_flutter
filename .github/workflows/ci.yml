name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --exclude-tags golden --coverage
      - run: cd example && flutter pub get && flutter analyze && flutter test
      - run: python3 tool/check_doc_snippets.py
      - run: dart pub publish --dry-run

  goldens:
    # Golden images are recorded on macOS; font rasterisation differs on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test --tags golden
